name: CI

on:
  push:
    branches:
      - "workflow"
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - "skills-lock.json"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - "v*"
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - "skills-lock.json"

permissions:
  contents: read
  packages: read
  checks: write
  actions: read

jobs:
  ci:
    name: dotnet ci
    uses: sketch7/.github/.github/workflows/dotnet-ci.yml@dotnet-libs-v3
